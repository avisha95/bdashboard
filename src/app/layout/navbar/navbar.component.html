<p-menubar [model]="items" styleClass="djp-navbar">
  <!-- LEFT -->
  <ng-template pTemplate="start">
    <div class="navbar-brand">
      <i
        class="pi pi-building"
        style="font-size: 1.1rem;"
      >
      </i>
      <span>DJP Dashboard Web</span>
    </div>
  </ng-template>

  <!-- RIGHT -->
  <ng-template pTemplate="end">
    <button
      pButton
      type="button"
      icon="pi pi-sign-out"
      label="Logout"
      class="p-button-text p-button-danger p-button-sm"
      (click)="logout()"
    >
    </button>
  </ng-template>
</p-menubar>
